name: Lint
on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        profile: [pe_dense, parallel]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Run recorded lint
        timeout-minutes: 5
        run: bash test/lint/run_recorded.sh "${{ matrix.profile }}"

      - name: Upload lint results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-${{ matrix.profile }}
          path: test/lint/results/
          if-no-files-found: error
          retention-days: 14